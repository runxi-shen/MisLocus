[project]
name = "prot-loc-benchmark"
version = "0.1.0"
description = "Minimal companion repo: reproduce the protein-localization benchmark from the published cell-crop dataset"
requires-python = ">= 3.12"
dependencies = []

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# ============================================================================
# PIXI CONFIGURATION
# ============================================================================

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.tasks]
prepare-cell-crops = "python scripts/01_prepare_cell_crops.py"

# ============================================================================
# ENVIRONMENT: default (preprocessing + classification + benchmarks, CPU only)
# ============================================================================

[tool.pixi.dependencies]
python = "3.12.*"
# Data
polars = ">=1.0"
pandas = ">=2.0"
numpy = ">=1.24,<2.0"
pyarrow = ">=14.0"
duckdb = ">=1.0"
psutil = ">=5.9"
# ML / classification
scikit-learn = ">=1.4"
xgboost = ">=2.0"
# Profile preprocessing
pycytominer = ">=1.0"
scipy = ">=1.11"
# Visualization
seaborn = ">=0.13"
matplotlib = ">=3.8"
# Utilities
loguru = ">=0.7"
tqdm = ">=4.65"
pooch = ">=1.9.0,<2"

[tool.pixi.pypi-dependencies]
prot_loc_benchmark = { path = ".", editable = true }
copairs = ">=0.4"
huggingface_hub = ">=0.24"

# ============================================================================
# ENVIRONMENT: gpu (XGBoost classification with CUDA)
# Inherits all default deps and adds cuda=12 system requirement so conda-forge
# resolves to a GPU-enabled xgboost build. Used by scripts/09_classify.py --gpu.
# ============================================================================

[tool.pixi.feature.gpu]

[tool.pixi.feature.gpu.system-requirements]
cuda = "12"

# ============================================================================
# ENVIRONMENT: cytoself (VQ-VAE training + inference, Python 3.10)
# Isolated env: cytoself requires Python <3.11.
# Optional — only needed to retrain Cytoself from crops.
# ============================================================================

[tool.pixi.feature.cytoself]
channels = ["pytorch", "conda-forge"]

[tool.pixi.feature.cytoself.dependencies]
python = "3.10.*"
pytorch = ">=2.0,<2.5"
torchvision = ">=0.15"
pytorch-cuda = "12.4.*"
numpy = ">=1.21,<2.0"
pandas = ">=1.4"
scikit-learn = ">=1.2"
scipy = ">=1.9"
scikit-image = ">=0.20"
tensorboard = ">=2.9"
protobuf = ">=3.20"
tqdm = ">=4.63"
matplotlib = ">=3.5"
seaborn = ">=0.11"
umap-learn = ">=0.5"
natsort = "*"
colorcet = ">=3"
joblib = ">=1.1"
pyarrow = ">=10.0"

# cytoself package is added to PYTHONPATH via sys.path in scripts.

[tool.pixi.feature.cytoself.system-requirements]
cuda = "12.4"

[tool.pixi.feature.cytoself.tasks]
preprocess-cytoself = "python scripts/07a_preprocess_cytoself.py"
train-cytoself      = "python scripts/07b_train_cytoself.py"
infer-cytoself      = "python scripts/07d_infer_cytoself_embeddings.py"

# ============================================================================
# ENVIRONMENT: subcell (SubCell frozen-ViT + fine-tune, Python 3.12)
# Isolated to avoid torch contamination of the default env.
# ============================================================================

[tool.pixi.feature.subcell]
channels = ["pytorch", "conda-forge"]

[tool.pixi.feature.subcell.dependencies]
python = "3.12.*"
pytorch = "==2.4.1"
pytorch-cuda = "12.4.*"
transformers = "==4.45.2"
numpy = ">=1.24,<2.0"
pandas = ">=2.0"
polars = ">=1.0"
pyarrow = ">=14.0"
lightning = "==2.6.1"
omegaconf = ">=2.3"
scipy = ">=1.10"
scikit-learn = ">=1.3"
pyyaml = ">=6.0"
requests = ">=2.28"
tqdm = ">=4.65"

[tool.pixi.feature.subcell.pypi-dependencies]
torchvision = "==0.19.1"
timm = "==1.0.26"
einops = ">=0.7"
torcheval = ">=0.0.7"

[tool.pixi.feature.subcell.system-requirements]
cuda = "12.4"

[tool.pixi.feature.subcell.tasks]
prepare-subcell          = "python scripts/08a_prepare_subcell.py"
extract-subcell          = "python scripts/08b_extract_subcell_embeddings.py"
train-subcell-finetune   = "python scripts/08c_train_subcell_finetune.py"
extract-subcell-finetune = "python scripts/08d_extract_subcell_finetune_embeddings.py"

# ============================================================================
# ENVIRONMENT: vit (MorphEm / HuggingFace ViT extraction)
# ============================================================================

[tool.pixi.feature.vit]
channels = ["pytorch", "conda-forge"]

[tool.pixi.feature.vit.dependencies]
python = "3.12.*"
pytorch = ">=2.0,<2.5"
pytorch-cuda = "12.4.*"
numpy = ">=1.24,<2.0"
polars = ">=1.0"
pyarrow = ">=14.0"
tqdm = ">=4.63"

[tool.pixi.feature.vit.pypi-dependencies]
transformers = ">=4.30,<4.40"

[tool.pixi.feature.vit.system-requirements]
cuda = "12.4"

[tool.pixi.feature.vit.tasks]
extract-vit = "python scripts/08b_extract_vit_embeddings.py"

# ============================================================================
# ENVIRONMENT DEFINITIONS
# ============================================================================

[tool.pixi.environments]
default  = { solve-group = "default" }
gpu      = { features = ["gpu"],      solve-group = "gpu" }
cytoself = { features = ["cytoself"], solve-group = "cytoself", no-default-feature = true }
subcell  = { features = ["subcell"],  solve-group = "subcell",  no-default-feature = true }
vit      = { features = ["vit"],      solve-group = "vit",      no-default-feature = true }

# ============================================================================
# RUFF CONFIGURATION
# ============================================================================

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py312"
include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N803",   # ML convention: X, Y for matrices
    "N806",   # ML convention: X_train, X_test
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
